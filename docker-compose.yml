services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medpredict_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-medpredict_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medpredict_pass}
      POSTGRES_DB: ${DB_NAME:-medpredict_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medpredict_user} -d ${DB_NAME:-medpredict_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: medpredict_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medpredict_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER:-medpredict_user}:${DB_PASSWORD:-medpredict_pass}@postgres:5432/${DB_NAME:-medpredict_db}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - APP_DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-medpredict_dev_secret_key_change_in_production_super_secure_32_bytes}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medpredict_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
